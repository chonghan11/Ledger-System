name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Compile + all 64 unit/integration tests against a real Postgres (Testcontainers uses the runner's Docker).
  test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and run tests
        run: chmod +x mvnw && ./mvnw -B verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: ledger-jar
          path: target/ledger-system-*.jar
          retention-days: 7

  # 2. Static checks on the frontend and repo hygiene.
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check src/main/resources/static/app.js
      - name: UI references existing assets
        run: |
          grep -q 'href="app.css"' src/main/resources/static/index.html
          grep -q 'src="app.js"' src/main/resources/static/index.html
      - name: Shell scripts are valid and LF-only
        run: |
          bash -n scripts/smoke-test.sh
          if grep -rlI $'\r' mvnw scripts/; then echo "CRLF line endings found"; exit 1; fi
      - name: No floating-point money in Java sources
        run: |
          # The ledger stores money as integer minor units; float/double must never appear in main code.
          # ("double-entry" in comments is the bookkeeping term, not the type, so it is excluded.)
          if grep -rnE '\b(float|double|Float|Double)\b' src/main/java | grep -viE 'double-entry'; then
            echo "float/double found in src/main/java"; exit 1
          fi

  # 3. Boot the real packaged app against Postgres and drive it over HTTP, exactly as a user would.
  smoke:
    name: End-to-end smoke test
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v8
        with:
          name: ledger-jar
          path: target
      - name: Start Postgres
        run: docker compose up -d --wait
      - name: Start the app
        run: |
          nohup java -jar target/ledger-system-*.jar > app.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/currencies > /dev/null && exit 0
            sleep 1
          done
          echo "app did not start"; cat app.log; exit 1
      - name: Smoke test
        run: bash scripts/smoke-test.sh http://localhost:8080
      - name: App log on failure
        if: failure()
        run: cat app.log

  # 4. Container image: always built (proves the Dockerfile works); pushed to GHCR only from main.
  image:
    name: Docker image
    needs: [test, static-checks, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: meta
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.meta.outputs.name }}:latest
            ${{ steps.meta.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
